[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inquiryon-amp-community"
version = "0.1.0"
description = "AMP Community Edition: HITL workflow, append-only audit, callback delivery (experimental v0)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
# jsonschema is a hard dependency here (unlike amp-core, which keeps it
# optional for pure in-process embedding): amp-community is a network-facing
# service that receives policy/HITL/evaluation payloads from untrusted
# callers, and inquiryon_amp_core.schema.validate() silently degrades to a
# required-fields-only check when jsonschema is absent — enum, const
# (schema_version), and pattern constraints go unenforced with no warning.
# That degraded mode is unacceptable for a service whose job is to reject
# malformed/out-of-version documents (OSS-006 contract-audit finding).
dependencies = ["inquiryon-amp-core>=0.1.0", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inquiryon_amp_community = ["api/openapi.json", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
