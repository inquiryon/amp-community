[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inquiryon-amp-community"
version = "0.0.1"
description = "AMP Community Edition: HITL workflow, append-only audit, callback delivery (experimental v0)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["inquiryon-amp-core"]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amp_community = ["api/openapi.json", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
